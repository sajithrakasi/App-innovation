<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | VegShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-success" href="index.html">VegShop</a>
        <a href="cart.html" class="btn btn-outline-success">Back to Cart</a>
    </div>
</nav>

<section class="checkout-section py-5">
    <div class="container">
        <h2 class="text-center mb-2">Secure Checkout</h2>
        <p class="text-center text-muted mb-5">Complete your delivery details</p>

        <div class="row g-4">

            <div class="col-lg-7">
                <div class="checkout-card">
                    <h4 class="mb-4">Delivery Information</h4>

                    <form>
                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" placeholder="Enter your name" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" placeholder="Enter phone number" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" placeholder="Enter email address" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Delivery Address</label>
                                <textarea class="form-control" rows="3" placeholder="House number, street, area" required></textarea>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" placeholder="City" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">State</label>
                                <input type="text" class="form-control" placeholder="State" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">PIN Code</label>
                                <input type="text" class="form-control" placeholder="PIN code" required>
                            </div>

                        </div>

                        <hr class="my-4">

                        <h4 class="mb-3">Payment Method</h4>

                        <div class="payment-option mb-3">
                            <input type="radio" name="payment" id="cod" checked>
                            <label for="cod">Cash on Delivery</label>
                        </div>

                        <div class="payment-option mb-4">
                            <input type="radio" name="payment" id="upi">
                            <label for="upi">UPI Payment</label>
                        </div>

                        <button type="submit" class="btn btn-success w-100 checkout-place-btn">
                            Place Order
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="checkout-summary">
                    <h4 class="mb-4">Order Summary</h4>

                    <div class="d-flex justify-content-between mb-3">
                        <span>Fresh Red Tomatoes</span>
                        <span>₹40</span>
                    </div>

                    <div class="d-flex justify-content-between mb-3">
                        <span>Delivery Charge</span>
                        <span>₹40</span>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between fw-bold fs-5">
                        <span>Total</span>
                        <span class="text-success">₹80</span>
                    </div>

                    <p class="text-muted small mt-3">
                        Your order details will be confirmed after checkout functionality is connected.
                    </p>
                </div>
            </div>

        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
