<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="list">
  <h1>Types of list</h1>
<h3>ordered list</h3>
<ol>
<li>green</li>
<li>yellow</li>
<li>orange</li>
</ol>
<h3>unordered list</h3>
<ul>
<li>apple</li>
<li>mango</li>
<li>graps</li>
</ul>
<h3>description list</h3>
<dl>
  <dt>name: sajithra</dt>
  <dd>full stack developer</dd>
</dl>
</div>
<div id = "tablerow">
  <h1>Tables</h1>
   <h3>Rowspan</h3>
  <table border="1">
    <tr>
      <td rowspan="2">A</td>
      <td>B</td>
    </tr>
    <tr>
      <td>C</td>
    </tr>
  </table>
</div>
<div id = "tablecolumn">
   <h3>columnspan</h3>
  <table border="1">
    <tr>
      <td colspan="3">90</td>
      <td>85</td>
    </tr>
    <tr>
      <td>70</td>
    </tr>
    </table>
</div>
<div id="form">

  <h1>Forms</h1>
  <form>
    <fieldset>
    <legend>Personal Information</legend>
    <label>Name:</label>
    <input type="text" name ="username"> <br><br>
    <label>Qualification:</label>
    <select>
    <option>BE</option>
    <option>BA</option>
    <option>MBA</option>
    </select><br><br>
    <label>Gender:</label>
    <input type="radio" name ="Gender"><lable>male</lable>
    <input type="radio" name ="Gender"><lable>female</lable><br><br>
    <label>address:</label>
    <input type="text" name ="address"><br><br>
    <label>Dob:</label>
    <input type="date"><br><br>
    <label>email:</label>
    <input type="email" name ="email"> <br><br>
    <label>password:</label>
    <input type="password" name ="password"> <br><br>
    <label>Number:</label>
    <input type="number" name ="number"> <br><br>
    <label>Telephone:</label>
    <input type="tel" name ="telephone"> <br><br>
    <label>checkbox:</label>
    <input type="checkbox" name ="aadhar"><lable>aadhar</lable>
    <input type="checkbox" name ="pan"><lable>pan</lable> <br><br>
    <label>fileupload:</label>
    <input type="file" name ="fileupload"><br><br>
    <button type="submit">submit</button>
    <button type="reset">reset</button>
    <button type="button" class="custom-btn">Click Me</button>

    </fieldset>
  </form>
</div>

</body>
</html>
